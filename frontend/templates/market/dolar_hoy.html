{% extends "base.html" %}

{% block title %}Dólar Hoy Argentina{% endblock %}

{% block extra_css %}
<style>
    .market-card {
        background: rgba(7, 30, 38, 0.4);
        border: 1px solid var(--3f-border);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        transition: all 0.3s ease;
    }
    .market-card:hover {
        border-color: var(--3f-success);
        box-shadow: 0 0 20px var(--3f-success-glow);
    }
    .rate-value {
        font-family: 'Orbitron', sans-serif;
        color: #00ff88;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }
    .text-success-neon {
        color: #00ff88;
    }
</style>
{% endblock %}

{% block content %}
<div x-data="dolarHoyPage" class="content-wrapper bg-transparent">
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="hud-title mb-0 neon-glow"><i class="fa-solid fa-hand-holding-dollar me-2"></i>DÓLAR HOY ARGENTINA</h1>
                <p class="text-dim extra-small mb-0">MONITOREO DE COTIZACIONES EN TIEMPO REAL</p>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-success neon-border" @click="fetchRates()" :disabled="loading">
                    <i class="fa-solid fa-sync me-1" :class="loading ? 'fa-spin' : ''"></i> ACTUALIZAR
                </button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <template x-for="(data, source) in rates" :key="source">
            <div class="col-md-6 col-lg-3">
                <div class="market-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h6 class="font-orbitron text-white text-uppercase mb-0" x-text="source"></h6>
                        <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-10">USD</span>
                    </div>
                    
                    <div class="hud-line mb-3"></div>

                    <div class="mb-3">
                        <small class="text-dim d-block mb-1">COMPRA</small>
                        <h3 class="rate-value mb-0" x-text="formatCurrency(data.compra)"></h3>
                    </div>

                    <div class="mb-3">
                        <small class="text-dim d-block mb-1">VENTA</small>
                        <h3 class="rate-value mb-0" x-text="formatCurrency(data.venta)"></h3>
                    </div>

                    <div class="extra-small text-dim mt-auto pt-2 border-top border-secondary border-opacity-10">
                        <p class="mb-0 text-truncate" x-text="'CASA: ' + data.casa.toUpperCase()"></p>
                        <p class="mb-0" x-text="'ACTUALIZADO: ' + formatDateTime(data.fecha)"></p>
                    </div>
                </div>
            </div>
        </template>

        <template x-if="Object.keys(rates).length === 0 && !loading">
            <div class="col-12">
                <div class="market-card p-5 text-center">
                    <i class="fa-solid fa-cloud-circle-exclamation fs-1 text-dim mb-3"></i>
                    <h5 class="text-dim">No se pudieron cargar las cotizaciones</h5>
                    <p class="small text-dim">Asegúrate de que el plugin esté correctamente configurado.</p>
                </div>
            </div>
        </template>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('dolarHoyPage', () => ({
            rates: {},
            loading: false,

            async init() {
                await this.fetchRates();
            },

            async fetchRates() {
                this.loading = true;
                try {
                    const res = await api.get('/market/dolar-hoy');
                    this.rates = res.data;
                } catch (e) {
                    console.error('Error fetching dollar rates:', e);
                    notifications.show('Error al obtener cotizaciones del dólar', 'error');
                } finally {
                    this.loading = false;
                }
            },

            formatCurrency(amount) {
                if (amount === null || amount === undefined) return '-';
                return new Intl.NumberFormat('es-AR', {
                    style: 'currency',
                    currency: 'ARS',
                    minimumFractionDigits: 2
                }).format(amount);
            },

            formatDateTime(dateStr) {
                if (!dateStr) return '-';
                try {
                    const date = new Date(dateStr);
                    return date.toLocaleString('es-AR');
                } catch (e) {
                    return dateStr;
                }
            }
        }));
    });
</script>
{% endblock %}
