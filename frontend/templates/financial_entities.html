{% extends "base.html" %}

{% block title %}<span x-text="$store.lang.t('entities.title')">Entidades Financieras</span>{% endblock %}
{% block header %}<span x-text="$store.lang.t('entities.title')">Gestión de Entidades Financieras</span>{% endblock %}

{% block content %}
<div x-data="financialEntitiesPage" class="content-wrapper bg-transparent">
    <!-- Tabs Navigation -->
    <ul class="nav nav-tabs mb-4 border-0" role="tablist">
        <li class="nav-item">
            <button class="nav-link border-0 hud-title extra-small px-4 py-2" :class="activeTab === 'types' ? 'active text-primary border-bottom border-primary' : 'text-dim bg-transparent opacity-50'" @click="activeTab = 'types'">
                <i class="fa-solid fa-layer-group me-2"></i><span x-text="$store.lang.t('entities.tab_types')">TIPOS DE ENTIDAD</span>
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link border-0 hud-title extra-small px-4 py-2" :class="activeTab === 'institutions' ? 'active text-primary border-bottom border-primary' : 'text-dim bg-transparent opacity-50'" @click="activeTab = 'institutions'">
                <i class="fa-solid fa-university me-2"></i><span x-text="$store.lang.t('entities.tab_list')">ENTIDADES</span>
            </button>
        </li>
    </ul>

    <!-- Tab: Entity Types -->
    <div x-show="activeTab === 'types'">
        <div class="row mb-4">
            <div class="col-12 mb-4 d-flex justify-content-between">
                <button class="neon-btn px-4 py-2 shadow-sm" @click="openTypeModal()">
                    <i class="fa-solid fa-plus-circle me-2"></i><span x-text="$store.lang.t('entities.new_type')">NUEVO TIPO</span>
                </button>
                <button class="btn btn-outline-info border-opacity-25" @click="seedData()" :disabled="seeding">
                    <span x-show="!seeding"><i class="fa-solid fa-database me-2"></i><span x-text="$store.lang.t('entities.seed')">CARGAR PREDEFINIDOS</span></span>
                    <span x-show="seeding" class="spinner-border spinner-border-sm"></span>
                </button>
            </div>
        </div>
        
        <div class="row g-3">
            <template x-for="type in entityTypes" :key="type.id">
                <div class="col-md-4 col-lg-3">
                    <div class="card neon-card h-100">
                        <div class="card-body text-center">
                            <i class="fa-solid fa-2xl mb-4" :class="type.icon" :style="`color: ${type.color}; filter: drop-shadow(0 0 10px ${type.color}44)`"></i>
                            <h5 class="card-title hud-title text-primary mb-3" x-text="type.name"></h5>
                            <p class="card-text text-dim extra-small text-uppercase opacity-75" x-text="type.description || '-'"></p>
                            <div class="mt-3">
                                <button class="btn btn-sm btn-outline-info" @click="editType(type)">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
            <template x-if="entityTypes.length === 0 && !loadingTypes">
                <div class="col-12 text-center p-5 opacity-50">
                    <i class="fa-solid fa-folder-open fs-1 mb-3 text-dim"></i>
                    <p class="hud-title extra-small" x-text="$store.lang.t('entities.empty_types')"></p>
                </div>
            </template>
        </div>
    </div>

    <!-- Tab: Institutions -->
    <div x-show="activeTab === 'institutions'">
        <div class="row mb-4">
            <div class="col-12 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <button class="neon-btn px-4 py-2 shadow-sm" @click="openInstitutionModal()">
                    <i class="fa-solid fa-building-circle-plus me-2"></i><span x-text="$store.lang.t('entities.new_inst')">NUEVA ENTIDAD</span>
                </button>
                <div class="d-flex align-items-center gap-3">
                    <select class="form-select bg-dark text-white border-secondary border-opacity-25 extra-small" x-model="filterType" @change="fetchInstitutions()">
                        <option value="" x-text="$store.lang.t('common.all')">Todos los tipos</option>
                        <template x-for="type in entityTypes" :key="type.id">
                            <option :value="type.id" x-text="type.name"></option>
                        </template>
                    </select>
                    <div class="input-group neon-border overflow-hidden" style="width: 250px;">
                        <span class="input-group-text bg-transparent border-0"><i class="fa-solid fa-search text-dim extra-small"></i></span>
                        <input type="text" class="form-control bg-transparent border-0 text-white extra-small" 
                               :placeholder="$store.lang.t('common.search')" x-model="searchQuery" @input="filterInstitutions">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card neon-card">
            <div class="card-body p-0 table-responsive">
                <template x-if="loadingInstitutions">
                    <div class="text-center p-5">
                        <div class="spinner-border text-primary" role="status"></div>
                    </div>
                </template>
                
                <table class="table table-hover table-dark mb-0" x-show="!loadingInstitutions && filteredInstitutions.length > 0">
                    <thead class="bg-black bg-opacity-40">
                        <tr class="extra-small tracking-wider fw-bold text-uppercase">
                            <th class="text-primary py-3" x-text="$store.lang.t('entities.col_name')">ENTIDAD</th>
                            <th class="text-primary py-3" x-text="$store.lang.t('entities.col_type')">TIPO</th>
                            <th class="text-primary py-3" x-text="$store.lang.t('entities.col_web')">WEB</th>
                            <th class="text-primary py-3" x-text="$store.lang.t('entities.col_id')">ID / CUIT</th>
                            <th class="text-primary py-3 text-end" x-text="$store.lang.t('common.actions')">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody class="align-middle">
                        <template x-for="inst in filteredInstitutions" :key="inst.id">
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <i class="fa-solid me-3" :class="inst.type_icon || 'fa-building'" :style="`color: ${inst.type_color || '#6c757d'}`"></i>
                                        <span class="fw-bold" x-text="inst.name"></span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge" :style="`background-color: ${inst.type_color || '#6c757d'}`" x-text="inst.type_name || 'Sin tipo'"></span>
                                </td>
                                <td>
                                    <a x-show="inst.website" :href="inst.website" target="_blank" class="text-info"><i class="fa-solid fa-external-link"></i></a>
                                    <span x-show="!inst.website" class="text-dim">-</span>
                                </td>
                                <td class="text-white" x-text="inst.tax_id || '-'"></td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-info me-1" @click="editInstitution(inst)">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" @click="deleteInstitution(inst.id)">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <template x-if="!loadingInstitutions && filteredInstitutions.length === 0">
                    <div class="text-center p-5 opacity-50">
                        <i class="fa-solid fa-building-circle-xmark fs-1 mb-3 text-dim"></i>
                        <p class="hud-title extra-small" x-text="$store.lang.t('entities.empty_inst')"></p>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Modal Type -->
    <div class="modal fade" id="typeModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content neon-modal">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title hud-title text-primary"><i class="fa-solid fa-layer-group me-2"></i> <span x-text="$store.lang.t('entities.new_type')">TIPO DE ENTIDAD</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form @submit.prevent="saveType">
                        <div class="mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('common.name')">NOMBRE</label>
                            <input type="text" class="form-control neon-input" x-model="typeForm.name" required>
                        </div>
                        <div class="mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('common.description')">DESCRIPCIÓN</label>
                            <input type="text" class="form-control neon-input" x-model="typeForm.description">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="text-dim small">ICONO (FontAwesome)</label>
                                <input type="text" class="form-control neon-input" x-model="typeForm.icon" placeholder="fa-university">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="text-dim small">COLOR</label>
                                <input type="color" class="form-control form-control-color" x-model="typeForm.color">
                            </div>
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-outline-secondary px-4 me-2 border-opacity-10" data-bs-dismiss="modal" x-text="$store.lang.t('common.cancel')">CANCELAR</button>
                            <button type="submit" class="btn neon-btn px-4 shadow-sm" :disabled="saving">
                                <span x-show="!saving" x-text="$store.lang.t('common.save')">GUARDAR</span>
                                <span x-show="saving" class="spinner-border spinner-border-sm"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Institution -->
    <div class="modal fade" id="institutionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content neon-modal">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title hud-title text-primary"><i class="fa-solid fa-building me-2"></i> <span x-text="$store.lang.t('entities.new_inst')">ENTIDAD FINANCIERA</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form @submit.prevent="saveInstitution">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('common.name')">NOMBRE</label>
                                <input type="text" class="form-control neon-input" x-model="institutionForm.name" required placeholder="Ej: Banco Santander">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_type')">TIPO</label>
                                <select class="form-select neon-input" x-model="institutionForm.type_id">
                                    <option value="" x-text="$store.lang.t('common.none')">Seleccionar...</option>
                                    <template x-for="type in entityTypes" :key="type.id">
                                        <option :value="type.id" x-text="type.name"></option>
                                    </template>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_web')">SITIO WEB</label>
                                <input type="url" class="form-control neon-input" x-model="institutionForm.website" placeholder="https://...">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_id')">CUIT</label>
                                <input type="text" class="form-control neon-input" x-model="institutionForm.tax_id" placeholder="30-12345678-9">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_phone')">TELÉFONO</label>
                                <input type="text" class="form-control neon-input" x-model="institutionForm.phone">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_branch')">SUCURSAL</label>
                                <input type="text" class="form-control neon-input" x-model="institutionForm.branch" placeholder="Casa Central, Sucursal Norte, etc.">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_contact')">CONTACTO</label>
                            <input type="text" class="form-control neon-input" x-model="institutionForm.contact">
                        </div>
                        <div class="mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('entities.col_address')">DIRECCIÓN</label>
                            <input type="text" class="form-control neon-input" x-model="institutionForm.address">
                        </div>
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-outline-secondary px-4 me-2 border-opacity-10" data-bs-dismiss="modal" x-text="$store.lang.t('common.cancel')">CANCELAR</button>
                            <button type="submit" class="btn neon-btn px-4 shadow-sm" :disabled="saving">
                                <span x-show="!saving" x-text="$store.lang.t('common.save')">GUARDAR</span>
                                <span x-show="saving" class="spinner-border spinner-border-sm"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('financialEntitiesPage', () => ({
            activeTab: 'types',
            entityTypes: [],
            institutions: [],
            filteredInstitutions: [],
            loadingTypes: true,
            loadingInstitutions: true,
            saving: false,
            seeding: false,
            searchQuery: '',
            filterType: '',
            
            typeForm: { name: '', description: '', icon: 'fa-university', color: '#0d6efd' },
            institutionForm: { name: '', type_id: '', website: '', tax_id: '', phone: '', contact: '', address: '' },
            isEditType: false,
            isEditInstitution: false,
            editTypeId: null,
            editInstitutionId: null,
            
            typeModal: null,
            institutionModal: null,

            async init() {
                // Wait for Bootstrap
                let attempts = 0;
                while (typeof bootstrap === 'undefined' && attempts < 20) {
                    await new Promise(r => setTimeout(r, 100));
                    attempts++;
                }
                
                this.typeModal = new bootstrap.Modal(document.getElementById('typeModal'));
                this.institutionModal = new bootstrap.Modal(document.getElementById('institutionModal'));

                // Tab Selection from URL hash
                const hash = window.location.hash;
                if (hash === '#types') this.activeTab = 'types';
                if (hash === '#institutions') this.activeTab = 'institutions';
                
                await this.fetchTypes();
                await this.fetchInstitutions();
            },
            
            async fetchTypes() {
                this.loadingTypes = true;
                try {
                    const res = await api.get('/financial-entities/types?include_inactive=true');
                    this.entityTypes = res.data.map(t => ({
                        ...t,
                        id: t.id ?? t.id_tipo,
                        name: t.name ?? t.nombre_tipo,
                        description: t.description ?? t.descripcion,
                        icon: t.icon ?? t.icono
                    }));
                } catch (e) {
                    console.error('Error fetching types:', e);
                } finally {
                    this.loadingTypes = false;
                }
            },
            
            async fetchInstitutions() {
                this.loadingInstitutions = true;
                try {
                    let url = '/financial-entities/institutions?include_inactive=true';
                    if (this.filterType) url += `&filter_type_id=${this.filterType}`;
                    const res = await api.get(url);
                    this.institutions = res.data.map(i => ({
                        ...i,
                        id: i.id ?? i.id_identidad,
                        name: i.name ?? i.nombre,
                        website: i.website ?? i.web,
                        tax_id: i.tax_id ?? i.cuit,
                        phone: i.phone ?? i.telefono,
                        contact: i.contact ?? i.contacto,
                        address: i.address ?? i.direccion,
                        type_id: i.type_id ?? i.id_tipo,
                        type_name: i.type_name ?? i.tipo_nombre,
                        type_icon: i.type_icon ?? i.tipo_icono,
                        type_color: i.type_color ?? i.tipo_color
                    }));
                    this.filterInstitutions();
                } catch (e) {
                    console.error('Error fetching institutions:', e);
                } finally {
                    this.loadingInstitutions = false;
                }
            },
            
            filterInstitutions() {
                const q = this.searchQuery.toLowerCase();
                this.filteredInstitutions = this.institutions.filter(e => 
                    e.name.toLowerCase().includes(q) ||
                    (e.type_name && e.type_name.toLowerCase().includes(q))
                );
            },
            
            async seedData() {
                this.seeding = true;
                try {
                    const res = await api.post('/financial-entities/seed');
                    await this.fetchTypes();
                    NotificationManager.success(res.data.message);
                } catch (e) {
                    NotificationManager.error(e.response?.data?.detail || 'Fallo al cargar predefinidos', 'Error');
                } finally {
                    this.seeding = false;
                }
            },
            
            // Type CRUD
            openTypeModal() {
                this.isEditType = false;
                this.typeForm = { name: '', description: '', icon: 'fa-university', color: '#0d6efd' };
                this.typeModal.show();
            },
            
            editType(type) {
                this.isEditType = true;
                this.editTypeId = type.id;
                this.typeForm = { ...type };
                this.typeModal.show();
            },
            
            async saveType() {
                this.saving = true;
                try {
                    if (this.isEditType) {
                        await api.put(`/financial-entities/types/${this.editTypeId}`, this.typeForm);
                    } else {
                        await api.post('/financial-entities/types', this.typeForm);
                    }
                    await this.fetchTypes();
                    this.typeModal.hide();
                    NotificationManager.success('Operación exitosa');
                } catch (e) {
                    NotificationManager.error(e.response?.data?.detail || 'Fallo al guardar tipo', 'Error');
                } finally {
                    this.saving = false;
                }
            },
            
            // Institution CRUD
            openInstitutionModal() {
                this.isEditInstitution = false;
                this.institutionForm = { name: '', type_id: '', website: '', tax_id: '', phone: '', contact: '', address: '' };
                this.institutionModal.show();
            },
            
            editInstitution(inst) {
                this.isEditInstitution = true;
                this.editInstitutionId = inst.id;
                this.institutionForm = { ...inst };
                this.institutionModal.show();
            },
            
            async saveInstitution() {
                this.saving = true;
                try {
                    const data = { ...this.institutionForm };
                    if (data.type_id === '') data.type_id = null;
                    
                    if (this.isEditInstitution) {
                        await api.put(`/financial-entities/institutions/${this.editInstitutionId}`, data);
                    } else {
                        await api.post('/financial-entities/institutions', data);
                    }
                    await this.fetchInstitutions();
                    this.institutionModal.hide();
                    NotificationManager.success('Operación exitosa');
                } catch (e) {
                    NotificationManager.error(e.response?.data?.detail || 'Fallo al guardar entidad', 'Error');
                } finally {
                    this.saving = false;
                }
            },
            
            async deleteInstitution(id) {
                if (!await NotificationManager.confirm('¿Desactivar esta entidad?')) return;
                try {
                    await api.delete(`/financial-entities/institutions/${id}`);
                    await this.fetchInstitutions();
                    NotificationManager.success('Entidad desactivada');
                } catch (e) {
                    NotificationManager.error(e.response?.data?.detail || 'Fallo al desactivar', 'Error');
                }
            }
        }))
    })
</script>
{% endblock %}
