<div id="transaction-modal" class="modal fade" tabindex="-1" x-data="transactionForm">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content hud-container bg-dark text-white border-primary" style="backdrop-filter: blur(20px); background: rgba(10, 10, 25, 0.9) !important;">
            
            <!-- Modal Header -->
            <div class="modal-header border-bottom border-primary border-opacity-25 py-2">
                <div class="d-flex align-items-center gap-3">
                    <i class="fa-solid fa-money-bill-transfer text-primary"></i>
                    <h5 class="modal-title font-orbitron smaller mb-0" x-text="editMode ? 'MODIFICAR TRANSACCIÓN' : 'NUEVA TRANSACCIÓN'"></h5>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body p-4">
                <form id="tx-form" @submit.prevent="submitForm">
                    
                    <!-- Tipo de Transacción (Toggle Visual) -->
                    <div class="transaction-type-switcher d-flex justify-content-center mb-4">
                        <div class="btn-group w-100 neon-border p-1" style="background: rgba(0,0,0,0.3);">
                            <button type="button" class="btn btn-sm flex-grow-1" 
                                    :class="formData.type === 'EXPENSE' ? 'btn-danger' : 'btn-outline-secondary'"
                                    @click="formData.type = 'EXPENSE'">
                                <i class="fa-solid fa-minus-circle me-1"></i> GASTO
                            </button>
                            <button type="button" class="btn btn-sm flex-grow-1" 
                                    :class="formData.type === 'INCOME' ? 'btn-success' : 'btn-outline-secondary'"
                                    @click="formData.type = 'INCOME'">
                                <i class="fa-solid fa-plus-circle me-1"></i> INGRESO
                            </button>
                            <button type="button" class="btn btn-sm flex-grow-1" 
                                    :class="formData.type === 'TRANSFER' ? 'btn-primary' : 'btn-outline-secondary'"
                                    @click="formData.type = 'TRANSFER'">
                                <i class="fa-solid fa-exchange-alt me-1"></i> TRF
                            </button>
                        </div>
                    </div>

                    <div class="row g-4">
                        <!-- Lado Izquierdo: Datos Core -->
                        <div class="col-md-7">
                            
                            <!-- Monto (Input Gigante) -->
                            <div class="amount-container mb-4">
                                <label class="text-dim smaller font-orbitron mb-1">MONTO PRINCIPAL</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-primary text-primary fw-bold" x-text="currencySymbol"></span>
                                    <input type="text" 
                                           class="form-control form-control-lg bg-transparent border-primary text-white amount-input"
                                           x-model="formData.amount"
                                           @input="evaluateExpression"
                                           placeholder="0.00"
                                           required>
                                </div>
                                <small class="text-dim mt-1 d-block" x-show="previewValue" x-text="'= ' + previewValue"></small>
                            </div>

                            <!-- Beneficiario (Payee) -->
                            <div class="mb-3">
                                <label class="text-dim smaller font-orbitron">BENEFICIARIO / ORIGEN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-transparent border-secondary text-dim"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control bg-dark text-white border-secondary" 
                                           placeholder="¿A quién le pagaste?" x-model="formData.payee_name" 
                                           list="payees-list">
                                    <datalist id="payees-list">
                                        <template x-for="p in payees" :key="p.id">
                                            <option :value="p.name"></option>
                                        </template>
                                    </datalist>
                                </div>
                            </div>

                            <!-- Cuenta y Categoría -->
                            <div class="row">
                                <div class="col-6">
                                    <label class="text-dim smaller font-orbitron">CUENTA</label>
                                    <select class="form-select bg-dark text-white border-secondary" x-model="formData.account_id" required>
                                        <template x-for="acc in accounts" :key="acc.id">
                                            <option :value="acc.id" x-text="acc.name"></option>
                                        </template>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="text-dim smaller font-orbitron">CATEGORÍA</label>
                                    <select class="form-select bg-dark text-white border-secondary" x-model="formData.category_id">
                                        <option value="">(Sin categoría)</option>
                                        <template x-for="cat in categories" :key="cat.id">
                                            <option :value="cat.id" x-text="cat.name"></option>
                                        </template>
                                    </select>
                                </div>
                            </div>

                        </div>

                        <!-- Lado Derecho: Metadatos -->
                        <div class="col-md-5">
                            
                            <!-- Fecha -->
                            <div class="mb-3">
                                <label class="text-dim smaller font-orbitron">FECHA</label>
                                <input type="date" class="form-control bg-dark text-white border-secondary" x-model="formData.date">
                                <div class="mt-1 d-flex gap-1">
                                    <button type="button" @click="setDate('today')" class="btn btn-xs btn-outline-secondary">HOY</button>
                                    <button type="button" @click="setDate('yesterday')" class="btn btn-xs btn-outline-secondary">AYER</button>
                                </div>
                            </div>

                            <!-- Tags -->
                            <div class="mb-3">
                                <label class="text-dim smaller font-orbitron">ETIQUETAS</label>
                                <div class="d-flex flex-wrap gap-1 p-2 border border-secondary rounded bg-black bg-opacity-25" style="min-height: 40px;">
                                    <template x-for="tag in formData.tags" :key="tag">
                                        <span class="badge bg-primary bg-opacity-25 text-primary border border-primary border-opacity-25">
                                            <span x-text="tag"></span>
                                            <i class="fa-solid fa-times ms-1 cursor-pointer" @click="removeTag(tag)"></i>
                                        </span>
                                    </template>
                                    <input type="text" class="border-0 bg-transparent text-white small" style="outline: none; width: 60px;" 
                                           placeholder="+ Tag" @keydown.enter.prevent="addTag($event.target.value); $event.target.value=''">
                                </div>
                            </div>

                            <!-- Notas -->
                            <div class="mb-3">
                                <label class="text-dim smaller font-orbitron">NOTAS / REFERENCIA</label>
                                <textarea class="form-control bg-dark text-white border-secondary small" rows="3" x-model="formData.notes"></textarea>
                            </div>

                        </div>
                    </div>

                    <!-- Sección Extra: OCR & Archivos -->
                    <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-info" @click="triggerOCR">
                                <i class="fa-solid fa-camera me-1"></i> ESCANEAR TICKET (IA)
                            </button>
                            <label class="btn btn-sm btn-outline-secondary mb-0">
                                <i class="fa-solid fa-paperclip me-1"></i> ADJUNTAR
                                <input type="file" hidden @change="handleFileUpload">
                            </label>
                        </div>
                        
                        <div class="form-check form-switch pt-1">
                            <input class="form-check-input" type="checkbox" id="reconciled" x-model="formData.reconciled">
                            <label class="form-check-label text-dim smaller" for="reconciled">CONCILIADO</label>
                        </div>
                    </div>

                </form>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-top border-primary border-opacity-25">
                <button type="button" class="btn btn-sm btn-outline-secondary px-4" data-bs-dismiss="modal">CANCELAR</button>
                <button type="submit" form="tx-form" class="btn btn-sm btn-primary px-5 neon-border-static" :disabled="submitting">
                    <i class="fa-solid fa-save me-1"></i>
                    <span x-text="submitting ? 'GUARDANDO...' : 'PROCESAR TRANSACCIÓN'"></span>
                </button>
            </div>

            <!-- Scanner Overlay (for OCR simulation) -->
            <div class="ocr-scanner" x-show="scanning" x-transition>
                <div class="scanner-line"></div>
                <p class="mt-3 font-orbitron text-primary">ANALIZANDO DOCUMENTO...</p>
            </div>

        </div>
    </div>
</div>

<style>
    .amount-input {
        font-size: 2rem !important;
        font-family: 'Consolas', monospace;
        letter-spacing: -1px;
    }
    .neon-border-static {
        box-shadow: 0 0 10px var(--3f-primary-glow);
    }
    .btn-xs {
        padding: 1px 5px;
        font-size: 0.65rem;
    }
    .ocr-scanner {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }
    .scanner-line {
        width: 80%;
        height: 2px;
        background: var(--neon-green);
        box-shadow: 0 0 15px var(--neon-green);
        animation: scan-move 2s infinite ease-in-out;
    }
    @keyframes scan-move {
        0%, 100% { transform: translateY(-50px); }
        50% { transform: translateY(50px); }
    }
</style>
