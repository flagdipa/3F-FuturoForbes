{% extends "base.html" %}

{% block title %}Gestión de Cuentas{% endblock %}

{% block content %}
<div x-data="accountsManager" class="container-fluid py-4">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="font-orbitron text-primary mb-0"><i class="fa-solid fa-wallet me-2"></i>ESTADO DE CUENTAS</h2>
        <button class="btn btn-primary neon-border-static" @click="openCreateModal()">
            <i class="fa-solid fa-plus-circle me-1"></i> NUEVA CUENTA
        </button>
    </div>

    <!-- Filtros Rápidos -->
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="btn-group btn-group-sm neon-border p-1 bg-black bg-opacity-25">
                <button class="btn" :class="filterType === 'ALL' ? 'btn-primary' : 'btn-outline-secondary'" @click="filterType = 'ALL'">TODAS</button>
                <button class="btn" :class="filterType === 'ASSET' ? 'btn-primary' : 'btn-outline-secondary'" @click="filterType = 'ASSET'">ACTIVOS</button>
                <button class="btn" :class="filterType === 'LIABILITY' ? 'btn-primary' : 'btn-outline-secondary'" @click="filterType = 'LIABILITY'">DEUDAS</button>
            </div>
        </div>
    </div>

    <!-- Grid de Cuentas -->
    <div class="row g-4" x-show="!loading">
        <template x-for="acc in filteredAccounts" :key="acc.id">
            <div class="col-md-4 col-xl-3">
                <div class="card hud-container h-100 border-opacity-25" :style="'border-color: ' + (acc.color || 'var(--neon-blue)')">
                    <div class="card-body p-4 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="badge bg-opacity-25" :class="acc.type === 'ASSET' ? 'bg-success text-success' : 'bg-danger text-danger'" x-text="acc.type"></div>
                            <div class="dropdown">
                                <i class="fa-solid fa-ellipsis-v text-dim cursor-pointer" data-bs-toggle="dropdown"></i>
                                <ul class="dropdown-menu dropdown-menu-dark">
                                    <li><a class="dropdown-item" href="#" @click="openEditModal(acc)"><i class="fa-solid fa-edit me-2"></i> Editar</a></li>
                                    <li><a class="dropdown-item" :href="'/cuentas/' + acc.id"><i class="fa-solid fa-list me-2"></i> Ver Libro Mayor</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item text-danger" href="#" @click="deleteAccount(acc)"><i class="fa-solid fa-trash me-2"></i> Eliminar</a></li>
                                </ul>
                            </div>
                        </div>
                        
                        <h4 class="fw-bold mb-1" x-text="acc.name"></h4>
                        <p class="text-dim small mb-4" x-text="acc.notes || 'Sin anotaciones'"></p>
                        
                        <div class="mt-auto">
                            <div class="hud-line mb-3"></div>
                            <div class="text-end">
                                <small class="text-dim d-block" x-text="acc.currency_code"></small>
                                <h3 class="mb-0 font-orbitron" :class="acc.current_balance >= 0 ? 'text-white' : 'text-danger'" x-text="formatCurrency(acc.current_balance, acc.currency_code)"></h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <div x-show="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-dim">Cargando cuentas...</p>
    </div>

    <!-- Modal de Creación/Edición -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content hud-container border-primary border-opacity-50">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title font-orbitron text-primary" x-text="modalTitle"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form @submit.prevent="saveAccount">
                        <div class="mb-3">
                            <label class="form-label text-dim small">Nombre de la Cuenta</label>
                            <input type="text" class="form-control hud-input" x-model="formData.name" required placeholder="Ej: Banco Galicia Sueldo">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-dim small">Tipo</label>
                                <select class="form-select hud-input" x-model="formData.type" required>
                                    <option value="ASSET">Activo (Cuenta, Efectivo)</option>
                                    <option value="LIABILITY">Pasivo (Deuda, Tarjeta)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-dim small">Moneda</label>
                                <select class="form-select hud-input" x-model="formData.currency_code" required>
                                    <option value="ARS">Peso Argentino (ARS)</option>
                                    <option value="USD">Dólar (USD)</option>
                                    <option value="EUR">Euro (EUR)</option>
                                    <option value="BTC">Bitcoin (BTC)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dim small">Entidad Financiera (Opcional)</label>
                            <select class="form-select hud-input" x-model="formData.institution_id">
                                <option value="">Ninguna</option>
                                <template x-for="ent in (institutions || [])" :key="ent.id">
                                    <option :value="ent.id" x-text="ent.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="mb-3" x-show="!editMode">
                            <label class="form-label text-dim small">Saldo Inicial</label>
                            <input type="number" step="0.01" class="form-control hud-input" x-model="formData.initial_balance">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dim small">Notas</label>
                            <textarea class="form-control hud-input" x-model="formData.notes" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-dim small">Color</label>
                            <input type="color" class="form-control hud-input p-1" x-model="formData.color" style="height: 40px;">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary neon-border-static">
                                <i class="fa-solid fa-save me-1"></i> GUARDAR CUENTA
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('accountsManager', () => ({
            accounts: [],
            institutions: [],
            filterType: 'ALL',
            loading: true,
            modalTitle: 'Nueva Cuenta',
            editMode: false,
            formData: {
                id: null,
                name: '',
                type: 'ASSET',
                currency_code: 'ARS',
                initial_balance: 0,
                notes: '',
                institution_id: '',
                color: '#00ccff'
            },

            async init() {
                this.fetchAccounts();
                this.fetchInstitutions();
            },

            async fetchAccounts() {
                this.loading = true;
                try {
                    const res = await window.api.get('/v1/accounts/');
                    this.accounts = Array.isArray(res.data) ? res.data : (res.data.data || []);
                } catch (e) {
                    console.error("Error fetching accounts", e);
                } finally {
                    this.loading = false;
                }
            },

            async fetchInstitutions() {
                try {
                    const res = await window.api.get('/v1/institutions/');
                    this.institutions = Array.isArray(res.data) ? res.data : (res.data.data || []);
                } catch (e) {
                    console.error("Error fetching institutions", e);
                    this.institutions = [];
                }
            },

            get filteredAccounts() {
                if (this.filterType === 'ALL') return this.accounts;
                return this.accounts.filter(a => a.type === this.filterType);
            },

            formatCurrency(val, code) {
                const formatter = new Intl.NumberFormat('es-AR', {
                    style: 'currency',
                    currency: code || 'ARS',
                    minimumFractionDigits: 2
                });
                return formatter.format(val);
            },

            resetForm() {
                this.formData = {
                    id: null,
                    name: '',
                    type: 'ASSET',
                    currency_code: 'ARS',
                    initial_balance: 0,
                    notes: '',
                    institution_id: '',
                    color: '#00ccff'
                };
            },

            openCreateModal() {
                this.resetForm();
                this.modalTitle = 'Nueva Cuenta';
                this.editMode = false;
                const modal = new bootstrap.Modal(document.getElementById('accountModal'));
                modal.show();
            },

            openEditModal(acc) {
                this.editMode = true;
                this.modalTitle = 'Editar Cuenta';
                this.formData = {
                    id: acc.id,
                    name: acc.name,
                    type: acc.type,
                    currency_code: acc.currency_code,
                    initial_balance: acc.initial_balance || 0,
                    notes: acc.notes || '',
                    institution_id: acc.institution_id || '',
                    color: acc.color || '#00ccff'
                };
                const modal = new bootstrap.Modal(document.getElementById('accountModal'));
                modal.show();
            },

            async saveAccount() {
                const url = this.editMode ? `/v1/accounts/${this.formData.id}` : '/v1/accounts/';
                const method = this.editMode ? 'put' : 'post';
                
                // Cleanup institution_id if empty
                const payload = { ...this.formData };
                if (!payload.institution_id) delete payload.institution_id;
                delete payload.id;

                try {
                    await window.api({
                        url: url,
                        method: method,
                        data: payload
                    });
                    
                    const modalEl = document.getElementById('accountModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                    
                    await this.fetchAccounts();
                    
                    if (window.NotificationManager) {
                        window.NotificationManager.success('Cuenta guardada correctamente');
                    }
                } catch (e) {
                    console.error("Save error", e);
                    alert("Error: " + (e.response?.data?.detail || "No se pudo guardar la cuenta"));
                }
            },

            async deleteAccount(acc) {
                if (!confirm(`¿Estás seguro de eliminar la cuenta "${acc.name}"?`)) return;

                try {
                    await window.api.delete(`/v1/accounts/${acc.id}`);
                    await this.fetchAccounts();
                    if (window.NotificationManager) {
                        window.NotificationManager.info('Cuenta eliminada');
                    }
                } catch (e) {
                    console.error("Delete error", e);
                    alert("Error al eliminar la cuenta");
                }
            }
        }));
    });
</script>
{% endblock %}
