{% extends "base.html" %}

{% block title %}Programadas{% endblock %}
{% block header %}{% endblock %}

{% block extra_css %}
<!-- FullCalendar 6 CDN -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<style>
    :root {
        --fc-border-color: rgba(255, 255, 255, 0.05);
        --fc-daygrid-event-dot-width: 8px;
    }
    .fc { font-family: 'Inter', sans-serif; background: rgba(7, 30, 38, 0.4); border-radius: 12px; padding: 20px; border: 1px solid var(--3f-border); }
    .fc .fc-toolbar-title { font-family: 'Orbitron', sans-serif; color: var(--3f-primary); text-transform: uppercase; font-size: 1.1rem; }
    .fc .fc-button-primary { background: rgba(37, 150, 190, 0.1); border: 1px solid var(--3f-primary); color: var(--3f-primary); text-transform: uppercase; font-size: 0.7rem; font-weight: bold; }
    .fc .fc-button-primary:hover { background: var(--3f-primary); color: #000; }
    .fc .fc-button-primary:disabled { background: transparent; border-color: rgba(255,255,255,0.1); color: #555; }
    .fc .fc-col-header-cell { padding: 10px 0; background: rgba(0,0,0,0.2); }
    .fc .fc-col-header-cell-cushion { color: var(--3f-text-dim); font-size: 0.7rem; text-transform: uppercase; text-decoration: none; }
    .fc .fc-daygrid-day-number { color: #fff; text-decoration: none; font-size: 0.85rem; padding: 8px; }
    .fc .fc-daygrid-day.fc-day-today { background: rgba(37, 150, 190, 0.05) !important; }
    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number { color: var(--3f-primary); font-weight: bold; }
    .fc .fc-event { cursor: pointer; border: none; padding: 2px 4px; border-radius: 4px; font-size: 0.75rem; }
    .fc-event-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Neon Status Colors */
    .event-withdrawal { background: rgba(220, 53, 69, 0.2) !important; border-left: 3px solid #dc3545 !important; color: #ffb3b3 !important; }
    .event-deposit { background: rgba(25, 135, 84, 0.2) !important; border-left: 3px solid #198754 !important; color: #b3ffcc !important; }
    .event-transfer { background: rgba(13, 202, 240, 0.2) !important; border-left: 3px solid #0dcaf0 !important; color: #b3f0ff !important; }
    
    .fc .fc-daygrid-more-link { color: var(--3f-primary); font-size: 0.7rem; }
    
    /* Selection HUD */
    .selection-hud { border-left: 4px solid var(--3f-primary); background: rgba(37, 150, 190, 0.05); padding: 15px; border-radius: 0 8px 8px 0; margin-bottom: 20px; display: none; }
</style>
{% endblock %}

{% block content %}
<div x-data="recurringPage" class="content-wrapper bg-transparent">
    <!-- Barra de acciones del Calendario -->
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="hud-title mb-0" x-text="$store.lang.t('recurring.title')">Configuración de Recurrentes</h1>
                <p class="text-dim small mb-0">Calendario de Ejecuciones Proyectadas</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-danger neon-border" @click="deleteFromCalendar()" :disabled="!selectedEvent">
                    <i class="fa-solid fa-trash me-1"></i> Borrar
                </button>
                <button class="btn btn-sm btn-outline-warning neon-border" @click="editFromCalendar()" :disabled="!selectedEvent">
                    <i class="fa-solid fa-pen-to-square me-1"></i> Modificar
                </button>
                <button class="btn btn-sm btn-primary neon-border" @click="newSchedule()">
                    <i class="fa-solid fa-calendar-plus me-1"></i> Crear
                </button>
            </div>
        </div>
    </div>

    <!-- Mensaje de evento seleccionado -->
    <div class="row mb-2" x-show="selectedEvent" x-cloak>
        <div class="col-12">
            <div class="alert alert-info d-flex align-items-center justify-content-between py-2 mb-0" style="border: 1px solid var(--3f-primary); background: rgba(37,150,190,0.08);">
                <span>
                    <i class="fa-solid fa-circle-check me-2"></i>
                    Evento seleccionado: <strong x-text="selectedEvent?.title"></strong>
                    &mdash; <span x-text="selectedEvent?.startStr"></span>
                </span>
                <button class="btn btn-sm btn-outline-secondary" @click="selectedEvent = null"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <!-- Calendario FullCalendar -->
    <div class="row mb-5">
        <div class="col-lg-8">
            <div id="calendar"></div>
        </div>
        <div class="col-lg-4">
            <div id="day-details" class="selection-hud h-100 shadow-hud" x-show="selectedDayEvents.length > 0">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h6 class="hud-title text-primary mb-0"><i class="fa-solid fa-microchip me-2"></i>EVENTOS DEL DÍA</h6>
                    <button class="btn-close btn-close-white btn-sm" @click="selectedDayEvents = []"></button>
                </div>
                <div class="custom-scrollbar" style="max-height: 500px; overflow-y: auto;">
                    <template x-for="ev in selectedDayEvents" :key="ev.id">
                        <div class="card bg-black border-secondary border-opacity-25 mb-2 hover-glow" @click="editById(ev.scheduleId)" style="cursor:pointer" :class="ev.scheduleId === selectedEvent?.extendedProps?.scheduleId ? 'border-primary' : ''">
                            <div class="card-body p-2">
                                <div class="d-flex justify-content-between">
                                    <span class="extra-small fw-bold" :class="ev.class" x-text="ev.type"></span>
                                    <span class="extra-small text-dim" x-text="formatCurrency(ev.amount)"></span>
                                </div>
                                <p class="small mb-0 mt-1" x-text="ev.title"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <!-- Listado de Programaciones HUD -->
    <div class="row">
        <template x-for="item in schedules" :key="item.id">
            <div class="col-md-4 mb-4">
                <div class="card neon-card h-100 bg-opacity-10 position-relative" :class="item.is_active ? 'border-hud' : 'border-secondary opacity-75'">
                    <!-- Status Indicator -->
                    <div class="position-absolute top-0 end-0 p-2">
                        <span class="badge" :class="item.is_active ? 'bg-success text-dark' : 'bg-secondary'" 
                              x-text="item.is_active ? $store.lang.t('recurring.status_active') : $store.lang.t('recurring.status_paused')"></span>
                    </div>

                    <div class="card-body">
                        <h5 class="text-primary fw-bold mb-1 font-orbitron" x-text="item.transaction_code"></h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <p class="text-dim small mb-0" x-text="item.notes || $store.lang.t('common.none')"></p>
                            <span class="badge rounded-pill border border-info text-info" 
                                  x-text="item.auto_execute ? 'AUTO' : 'MANUAL'" style="font-size: 0.65rem;"></span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-dim extra-small fw-bold" x-text="$store.lang.t('recurring.frequency')"></span>
                            <span class="fw-bold" x-text="getFrequencyLabel(item.frequency)"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-dim extra-small fw-bold" x-text="$store.lang.t('recurring.next_date')"></span>
                            <span class="text-warning fw-bold" x-text="formatDate(item.next_date)"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 border-top border-secondary border-opacity-25 pt-2">
                            <span class="text-dim extra-small fw-bold" x-text="$store.lang.t('transactions.columns.amount')"></span>
                            <span class="text-success fw-bold h5 mb-0" x-text="formatCurrency(item.amount)"></span>
                        </div>

                        <div class="d-grid gap-2 border-top border-secondary border-opacity-25 pt-3">
                            <button class="btn btn-sm btn-outline-primary neon-border" @click="executeNow(item)" :disabled="!item.is_active">
                                <i class="fa-solid fa-play me-2"></i><span x-text="$store.lang.t('recurring.execute_now')"></span>
                            </button>
                            <div class="d-flex gap-2">
                                <button class="btn btn-sm btn-outline-secondary flex-grow-1" @click="editSchedule(item)">
                                    <i class="fa-solid fa-pen-to-square me-2"></i><span x-text="$store.lang.t('common.edit')"></span>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" @click="deleteSchedule(item.id)">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Modal de Edición/Creación HUD -->
    <div class="modal fade" id="modalScheduled" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-black border-hud shadow-hud">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title font-orbitron text-primary" x-text="'PROG_TASK_EDITOR_v2.0'"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.type')"></label>
                            <select class="form-select bg-black border-secondary text-white" x-model="editItem.transaction_code">
                                <option value="Withdrawal" x-text="$store.lang.t('common.expense')"></option>
                                <option value="Deposit" x-text="$store.lang.t('common.income')"></option>
                                <option value="Transfer" x-text="$store.lang.t('common.transfer')"></option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.account')"></label>
                            <select class="form-select bg-black border-secondary text-white" x-model.number="editItem.account_id">
                                <option :value="null" x-text="$store.lang.t('common.select_account')"></option>
                                <template x-for="c in collections.accounts" :key="c.id">
                                    <option :value="c.id" x-text="c.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3" x-show="editItem.transaction_code === 'Transfer'">
                            <label class="text-dim extra-small fw-bold text-uppercase text-warning" x-text="$store.lang.t('recurring.target_account')"></label>
                            <select class="form-select bg-black border-warning border-opacity-50 text-white" x-model.number="editItem.target_account_id">
                                <option :value="null" x-text="$store.lang.t('common.select_target')"></option>
                                <template x-for="c in collections.accounts" :key="c.id">
                                    <option :value="c.id" x-text="c.name" :disabled="c.id === editItem.account_id"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.beneficiary')"></label>
                            <select class="form-select bg-black border-secondary text-white" x-model.number="editItem.payee_id">
                                <option :value="null" x-text="$store.lang.t('common.select_beneficiary')"></option>
                                <template x-for="b in collections.payees" :key="b.id">
                                    <option :value="b.id" x-text="b.name"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.category')"></label>
                            <select class="form-select bg-black border-secondary text-white" x-model.number="editItem.category_id">
                                <option :value="null" x-text="$store.lang.t('common.no_category')"></option>
                                <template x-for="cat in collections.categories" :key="cat.id">
                                    <option :value="cat.id" x-text="cat.name"></option>
                                </template>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.frequency')"></label>
                            <select class="form-select bg-black border-secondary text-white" x-model="editItem.frequency">
                                <option value="Daily" x-text="$store.lang.t('recurring.daily')"></option>
                                <option value="Weekly" x-text="$store.lang.t('recurring.weekly')"></option>
                                <option value="Monthly" x-text="$store.lang.t('recurring.monthly')"></option>
                                <option value="Yearly" x-text="$store.lang.t('recurring.yearly')"></option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.interval')"></label>
                            <input type="number" class="form-control bg-black border-secondary text-white" x-model.number="editItem.interval">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.start_date')"></label>
                            <input type="date" class="form-control bg-black border-secondary text-white" x-model="editItem.start_date">
                        </div>
                        <div class="col-md-6 mb-3">
                             <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.next_date')"></label>
                            <input type="date" class="form-control bg-black border-secondary text-white" x-model="editItem.next_date">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('transactions.columns.amount')"></label>
                            <input type="number" step="0.01" class="form-control bg-black border-secondary text-success fw-bold" x-model.number="editItem.amount">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="text-dim extra-small fw-bold text-uppercase" x-text="$store.lang.t('recurring.notes')"></label>
                        <textarea class="form-control bg-black border-secondary text-white" rows="2" x-model="editItem.notes"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" x-model="editItem.is_active" :true-value="1" :false-value="0" id="checkIsActive">
                                <label class="form-check-label text-dim extra-small fw-bold text-uppercase" for="checkIsActive" x-text="$store.lang.t('recurring.active_status')"></label>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" x-model="editItem.auto_execute" id="checkAuto">
                                <label class="form-check-label text-dim extra-small fw-bold text-uppercase" for="checkAuto" x-text="$store.lang.t('recurring.auto_execute')"></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" x-text="$store.lang.t('common.cancel')"></button>
                    <button type="button" class="btn neon-btn" @click="saveSchedule()" :disabled="saving">
                        <span x-show="!saving" x-text="$store.lang.t('common.save')"></span>
                        <span x-show="saving" class="spinner-border spinner-border-sm"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('recurringPage', () => ({
        schedules: [],
        loading: false,
        saving: false,
        bsModal: null,
        editItem: { is_active: 1, frequency: 'Monthly', interval: 1 },
        collections: { accounts: [], payees: [], categories: [] },
        fullCalendar: null,
        selectedDayEvents: [],
        selectedEvent: null,

        async init() {
            this.bsModal = new bootstrap.Modal(document.getElementById('modalScheduled'));
            this.initCalendar();
            await this.loadCollections();
            await this.listSchedules();
        },

        initCalendar() {
            const calendarEl = document.getElementById('calendar');
            this.fullCalendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listMonth'
                },
                themeSystem: 'standard',
                height: 'auto',
                firstDay: 1,
                eventClick: (info) => {
                    if (this.selectedEvent?.id === info.event.id) {
                        this.selectedEvent = null;
                        info.el.classList.remove('fc-event-selected');
                        return;
                    }
                    this.selectedEvent = info.event;
                    this.showDayDetails(info.event.startStr);
                },
                dateClick: (info) => {
                    this.selectedEvent = null;
                    this.showDayDetails(info.dateStr);
                }
            });
            this.fullCalendar.render();
        },

        showDayDetails(dateStr) {
            this.selectedDayEvents = this.getEventsForDate(dateStr);
        },

        getEventsForDate(dateStr) {
            return this.schedules
                .filter(s => s.is_active && s.next_date && s.next_date.split('T')[0] === dateStr)
                .map(s => ({
                    id: s.id + '_' + dateStr,
                    scheduleId: s.id,
                    title: s.notes || (s.payee_id ? 'Programada' : 'Ajuste'),
                    amount: s.amount,
                    type: s.transaction_code,
                    class: this.getEventClass(s.transaction_code),
                    original: s
                }));
        },

        getEventClass(type) {
            const map = { 'Withdrawal': 'text-danger', 'Deposit': 'text-success', 'Transfer': 'text-info' };
            return map[type] || 'text-warning';
        },

        _projectDates(schedule, n = 6) {
            const dates = [];
            if (!schedule.next_date) return dates;
            let d = new Date(schedule.next_date.split('T')[0]);
            const freq = schedule.frequency || 'Monthly';
            const interval = parseInt(schedule.interval) || 1;
            for (let i = 0; i < n; i++) {
                dates.push(new Date(d));
                if (freq === 'Daily') d.setDate(d.getDate() + interval);
                else if (freq === 'Weekly') d.setDate(d.getDate() + 7 * interval);
                else if (freq === 'Monthly') d.setMonth(d.getMonth() + interval);
                else if (freq === 'Yearly') d.setFullYear(d.getFullYear() + interval);
            }
            return dates;
        },

        refreshCalendarEvents() {
            if (!this.fullCalendar) return;
            this.fullCalendar.removeAllEvents();
            const colors = { 'Withdrawal': 'event-withdrawal', 'Deposit': 'event-deposit', 'Transfer': 'event-transfer' };
            const events = [];
            this.schedules.filter(s => s.is_active && s.next_date).forEach(s => {
                this._projectDates(s, 6).forEach(date => {
                    events.push({
                        id: s.id + '_' + date.toISOString().split('T')[0],
                        title: s.notes || s.transaction_code,
                        start: date.toISOString().split('T')[0],
                        className: colors[s.transaction_code] || '',
                        extendedProps: { scheduleId: s.id, amount: s.amount }
                    });
                });
            });
            this.fullCalendar.addEventSource(events);
        },

        async loadCollections() {
            try {
                const [accounts, payees, cats] = await Promise.all([
                    api.get('/accounts/'),
                    api.get('/payees/'),
                    api.get('/categories/')
                ]);
                
                const rawAccounts = accounts.data.data || accounts.data || [];
                this.collections.accounts = rawAccounts.map(a => ({
                    ...a,
                    id: a.id ?? a.id_cuenta,
                    name: a.name ?? a.nombre_cuenta
                }));
                
                const rawPayees = payees.data.data || payees.data || [];
                this.collections.payees = rawPayees.map(p => ({
                    ...p,
                    id: p.id ?? p.id_beneficiario,
                    name: p.name ?? p.nombre_beneficiario ?? p.nombre
                }));
                
                const rawCats = cats.data.data || cats.data || [];
                this.collections.categories = rawCats.map(c => ({
                    ...c,
                    id: c.id ?? c.id_categoria,
                    name: c.name ?? c.nombre_categoria
                }));
            } catch (error) {
                console.error('Error al cargar colecciones:', error);
            }
        },

        async listSchedules() {
            this.loading = true;
            try {
                const response = await api.get('/recurring/');
                const rawSchedules = response.data.data || response.data || [];
                this.schedules = rawSchedules.map(s => ({
                    ...s,
                    id: s.id ?? s.id_recurrencia,
                    transaction_code: s.transaction_code ?? s.codigo_transaccion,
                    account_id: s.account_id ?? s.id_cuenta,
                    target_account_id: s.target_account_id ?? s.id_cuenta_destino,
                    payee_id: s.payee_id ?? s.id_beneficiario,
                    category_id: s.category_id ?? s.id_categoria,
                    amount: s.amount ?? s.monto_transaccion,
                    frequency: s.frequency ?? s.frecuencia,
                    interval: s.interval ?? s.intervalo,
                    start_date: s.start_date ?? s.fecha_inicio,
                    next_date: s.next_date ?? s.proxima_fecha,
                    is_active: s.is_active ?? s.activo,
                    notes: s.notes ?? s.notas
                }));
                this.refreshCalendarEvents();
            } catch (error) {
                console.error('Error al listar programaciones:', error);
            } finally {
                this.loading = false;
            }
        },

        newSchedule() {
            this.editItem = {
                id: 'NEW',
                transaction_code: 'Withdrawal',
                account_id: null,
                target_account_id: null,
                payee_id: null,
                category_id: null,
                amount: 0,
                frequency: 'Monthly',
                interval: 1,
                start_date: new Date().toISOString().split('T')[0],
                next_date: new Date().toISOString().split('T')[0],
                is_active: 1,
                auto_execute: true,
                notes: ''
            };
            this.bsModal.show();
        },

        editSchedule(item) {
            this.editItem = JSON.parse(JSON.stringify(item));
            this.selectedEvent = null;
            this.bsModal.show();
        },

        editById(id) {
            const item = this.schedules.find(s => s.id === id);
            if (item) this.editSchedule(item);
        },

        editFromCalendar() {
            if (!this.selectedEvent) return;
            const id = this.selectedEvent.extendedProps?.scheduleId;
            if (id) this.editById(id);
        },

        async deleteFromCalendar() {
            if (!this.selectedEvent) return;
            const id = this.selectedEvent.extendedProps?.scheduleId;
            if (id) await this.deleteSchedule(id);
            this.selectedEvent = null;
        },

        async saveSchedule() {
            this.saving = true;
            try {
                const payload = { ...this.editItem };
                if (payload.id === 'NEW') {
                    await api.post('/recurring/', payload);
                } else {
                    await api.put(`/recurring/${payload.id}`, payload);
                }
                await this.listSchedules();
                this.bsModal.hide();
                NotificationManager.success('Programación guardada');
            } catch (error) {
                NotificationManager.error((error.response?.data?.detail || error.message), 'Error al guardar');
            } finally {
                this.saving = false;
            }
        },

        async deleteSchedule(id) {
            if (!await NotificationManager.confirm('¿Deseas eliminar esta programación permanente?')) return;
            try {
                await api.delete(`/recurring/${id}`);
                this.schedules = this.schedules.filter(s => s.id !== id);
                NotificationManager.success('Programación eliminada');
            } catch (error) {
                NotificationManager.error('Error al eliminar');
            }
        },

        async executeNow(item) {
            if (!await NotificationManager.confirm('¿Ejecutar esta transacción ahora y generar el asiento en el libro?')) return;
            try {
                const res = await api.post(`/recurring/${item.id}/execute`);
                NotificationManager.success('Transacción generada con éxito. Próxima ejecución: ' + res.data.next_date);
                await this.listSchedules();
            } catch (error) {
                NotificationManager.error((error.response?.data?.detail || error.message), 'Error al ejecutar');
            }
        },

        getFrequencyLabel(f) {
            const map = {
                'Daily': this.$store.lang.t('recurring.daily'),
                'Weekly': this.$store.lang.t('recurring.weekly'),
                'Monthly': this.$store.lang.t('recurring.monthly'),
                'Yearly': this.$store.lang.t('recurring.yearly')
            };
            return map[f] || f;
        },

        formatDate(d) { return d ? new Date(d).toLocaleDateString('es-AR') : '-'; },
        formatCurrency(v) { return CurrencyUtils.formatCurrency(v); }
    }));
});
</script>
